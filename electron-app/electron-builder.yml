appId: com.filetoolbox.app
productName: File Toolbox
copyright: MIT

directories:
  output: release
  buildResources: build

artifactName: File.Toolbox-${version}-${arch}.${ext}

publish:
  provider: github
  owner: lxl2000927
  repo: file-toolbox
  releaseType: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../engine/dist/
    to: engine/
    filter:
      - "*.exe"

win:
  signAndEditExecutable: false  # TODO: 配置代码签名证书后改为 true
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: ../packaging/app.ico

nsis:
  artifactName: File.Toolbox-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  differentialPackage: true
  include: build/installer.nsh

portable:
  artifactName: File.Toolbox-${version}-${arch}-portable.${ext}
